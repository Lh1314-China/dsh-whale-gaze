<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Whale watching">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2d44"/>
      <stop offset="1" stop-color="#05161f"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.6" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#a8f0ff"/>
      <stop offset="0.6" stop-color="#39a0cf"/>
      <stop offset="1" stop-color="#0f4d70"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#deep)"/>
  <!-- whale body -->
  <path d="M14 70c10-16 32-24 50-24 16 0 28 6 34 14 6-2 12-2 16 1-3 3-4 6-3 10 5 0 9 2 12 5-6 2-11 5-14 9-9 10-27 16-45 16-22 0-40-11-46-24 2-3 4-5 6-7z" fill="#12405f"/>
  <!-- belly -->
  <path d="M22 78c10 10 27 16 44 16 12 0 23-3 31-8-6 9-19 15-32 15-18 0-34-9-43-23z" fill="#1d5b80" opacity="0.85"/>
  <!-- eye -->
  <circle cx="66" cy="66" r="15" fill="#f2fbff"/>
  <circle cx="69" cy="65" r="9" fill="url(#iris)"/>
  <circle cx="69" cy="65" r="4.5" fill="#04161f"/>
  <circle cx="64.5" cy="60.5" r="3" fill="#ffffff" opacity="0.9"/>
  <!-- gaze line to a moving dot -->
  <path d="M84 62c9-4 17-6 24-6" stroke="#7fe3ff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 5" opacity="0.75"/>
  <circle cx="110" cy="56" r="4.6" fill="#8beeff"/>
  <circle cx="110" cy="56" r="8" fill="none" stroke="#8beeff" stroke-width="1.4" opacity="0.45"/>
</svg>
